apiVersion: v1
kind: Secret
metadata:
  name: mikrotik-nms-secrets
  namespace: mikrotik-nms
type: Opaque
stringData:
  MIKROTIK_NMS_JWT_SECRET: "CHANGE-ME-to-a-random-secret"
  # Required: device passwords are encrypted with it, and the backend refuses
  # to start with polling on and no key (`openssl rand -hex 32`). Back it up:
  # without it the stored device passwords cannot be read.
  MIKROTIK_NMS_ENCRYPTION_KEY: ""
