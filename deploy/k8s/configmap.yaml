apiVersion: v1
kind: ConfigMap
metadata:
  name: mikrotik-nms-config
  namespace: mikrotik-nms
data:
  MIKROTIK_NMS_LISTEN: ":8080"
  MIKROTIK_NMS_DB_PATH: "/data/mikrotik-nms.db"
  # Device polling: "local" polls the devices, "off" does no device/UDP I/O.
  MIKROTIK_NMS_POLLERS: "local"
  # Subnet(s) the devices live in (comma-separated CIDRs). REQUIRED with
  # MIKROTIK_NMS_POLLERS=local: the backend refuses to start while it is empty
  # and never dials outside it. The pods must be able to reach them.
  MIKROTIK_NMS_ALLOWED_TARGET_CIDRS: ""
  MIKROTIK_NMS_HEALTH_INTERVAL: "30s"
  MIKROTIK_NMS_TOPOLOGY_INTERVAL: "60s"
  MIKROTIK_NMS_FIRMWARE_INTERVAL: "6h"
  MIKROTIK_NMS_NETWORK_HEALTH_INTERVAL: "60s"
  MIKROTIK_NMS_RETENTION_INTERVAL: "1h"
  MIKROTIK_NMS_RETENTION_DAYS: "7"
  MIKROTIK_NMS_DEFAULT_ROS_USER: "admin"
  MIKROTIK_NMS_DEFAULT_ROS_PORT: "8728"
  MIKROTIK_NMS_DEFAULT_ROS_TLS: "false"
  # Flow collector (NetFlow v5/v9, IPFIX, sFlow over UDP) — off unless set.
  # To enable, uncomment and also apply optional/flow-service.yaml (a UDP
  # LoadBalancer with externalTrafficPolicy: Local, so exporters keep their
  # source IP), then point exporters at its external IP, port 2055/udp.
  # MIKROTIK_NMS_FLOW_LISTEN: ":2055"
